name: Convert Instagram media to JPEG
on:
  push:
    branches: [instagram-media]
    paths:
      - 'temp/kervansoft-2026-10-26-oglen-on-muhasebe-post.png'
      - 'temp/kervansoft-2026-10-26-oglen-on-muhasebe-story.png'
      - '.github/workflows/instagram-convert-20261026.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instagram-media
      - name: Install converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Convert files
        run: |
          convert temp/kervansoft-2026-10-26-oglen-on-muhasebe-post.png -strip -quality 90 temp/kervansoft-2026-10-26-oglen-on-muhasebe-post.jpg
          convert temp/kervansoft-2026-10-26-oglen-on-muhasebe-story.png -strip -quality 90 temp/kervansoft-2026-10-26-oglen-on-muhasebe-story.jpg
      - name: Commit JPEG files
        run: |
          git config user.name "KervanSoft Automation"
          git config user.email "automation@kervansoft.com"
          git add temp/kervansoft-2026-10-26-oglen-on-muhasebe-post.jpg temp/kervansoft-2026-10-26-oglen-on-muhasebe-story.jpg
          git rm temp/kervansoft-2026-10-26-oglen-on-muhasebe-post.png temp/kervansoft-2026-10-26-oglen-on-muhasebe-story.png .github/workflows/instagram-convert-20261026.yml
          git commit -m "Prepare KervanSoft 26 Oct noon JPEG media"
          git push origin HEAD:instagram-media
